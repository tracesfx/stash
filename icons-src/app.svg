<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Stash app icon: a pane of liquid glass over soft blurred colour (the Liquid Glass look), carrying the
       capture mark (four corner brackets around a glass bead). Rendered by scripts/make-icons.mjs. -->
  <defs>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="232"/></clipPath>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2140"/>
      <stop offset="1" stop-color="#120f26"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="78"/></filter>
    <filter id="softer" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <!-- glass plate: bright at the top, nearly clear at the bottom -->
    <linearGradient id="pane" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".07"/>
    </linearGradient>
    <!-- edge light: strongest along the top-left, a hairline elsewhere -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset=".7" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="tilerim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0ff"/>
    </linearGradient>
    <radialGradient id="bead" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#e4e9ff"/>
      <stop offset="1" stop-color="#b9c4ff"/>
    </radialGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b0820" flood-opacity=".45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#tile)">
    <!-- deep backdrop with blurred colour light (the glass colours: blue, violet, cyan) -->
    <rect x="64" y="64" width="896" height="896" fill="url(#base)"/>
    <g filter="url(#soft)">
      <circle cx="250" cy="250" r="300" fill="#4f7cff"/>
      <circle cx="840" cy="330" r="270" fill="#a35cff"/>
      <circle cx="560" cy="900" r="320" fill="#38d0e0"/>
      <circle cx="220" cy="860" r="220" fill="#7b5cff" opacity=".85"/>
      <circle cx="560" cy="520" r="260" fill="#6470ff" opacity=".75"/>
      <circle cx="900" cy="800" r="200" fill="#4fa8ff" opacity=".7"/>
      <circle cx="560" cy="80" r="200" fill="#8a6cff" opacity=".7"/>
    </g>
    <!-- the glass pane, floating a little above the backdrop -->
    <g filter="url(#lift)">
      <rect x="176" y="176" width="672" height="672" rx="168" fill="url(#pane)"/>
    </g>
    <rect x="176" y="176" width="672" height="672" rx="168" fill="none" stroke="url(#rim)" stroke-width="5"/>
    <!-- specular sheen across the top of the pane -->
    <path d="M232 340c40-112 140-164 280-164h120c56 0 98 12 132 34-160-22-372 2-532 130z" fill="#ffffff" opacity=".16" filter="url(#softer)"/>
    <!-- the capture mark -->
    <g filter="url(#lift)" fill="none" stroke="url(#mark)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round">
      <path d="M296 452V318c0-12 10-22 22-22h134"/>
      <path d="M572 296h134c12 0 22 10 22 22v134"/>
      <path d="M728 572v134c0 12-10 22-22 22H572"/>
      <path d="M452 728H318c-12 0-22-10-22-22V572"/>
    </g>
    <g filter="url(#glow)">
      <circle cx="512" cy="512" r="58" fill="url(#bead)"/>
    </g>
    <circle cx="496" cy="494" r="16" fill="#ffffff" opacity=".9"/>
    <!-- outer edge of the tile -->
    <rect x="66" y="66" width="892" height="892" rx="230" fill="none" stroke="url(#tilerim)" stroke-width="4"/>
  </g>
</svg>
