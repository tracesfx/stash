<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stash note</title>
    <style>
      html, body { background: transparent !important; overflow: hidden; }
      #wrap { height: 100%; padding: 12px; }
      #box {
        height: 100%; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 14px;
        background: var(--surface-solid); border: 1px solid var(--line); border-radius: var(--r-l); box-shadow: var(--shadow);
        backdrop-filter: var(--blur); animation: in 200ms var(--ease) both;
      }
      :root[data-theme="glass"] #box { background: var(--glass-card); }
      @keyframes in { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
      svg { flex: none; width: 18px; height: 18px; fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      #note { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 14px; padding: 8px 0; }
      #note::placeholder { color: var(--faint); }
      .keys { display: flex; gap: 4px; flex: none; color: var(--faint); font-size: 11px; align-items: center; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="box">
        <svg viewBox="0 0 16 16"><path d="M3 13l1-3.5L11.5 2l2.5 2.5L6.5 12 3 13z"/><path d="M10 3.5l2.5 2.5"/></svg>
        <input id="note" type="text" placeholder="Quick note…" autocomplete="off" spellcheck="true" />
        <div class="keys"><kbd>Enter</kbd> save <kbd>Esc</kbd></div>
      </div>
    </div>
    <script type="module" src="/src/note.ts"></script>
  </body>
</html>
