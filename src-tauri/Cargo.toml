[package]
name = "stash"
version = "0.2.0"
description = "Fast inspiration capture"
license = "MIT"
repository = "https://github.com/tracesfx/stash"
edition = "2024"

[lib]
# `_lib` suffix avoids a Windows bin/lib name clash, see rust-lang/cargo#8519
name = "stash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-drag = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
sha2 = "0.10"
tiny-skia = "0.12"
fontdue = "0.9"
arboard = "3"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm", "Win32_System_DataExchange", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_System_Variant", "Win32_System_Registry", "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "Win32_System_WinRT_Graphics_Direct2D", "System", "UI_Composition", "UI_Composition_Desktop", "Graphics_Effects", "Foundation", "Foundation_Collections", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Globalization"] }
windows-core = "0.62" # #[implement] for the composition effect objects (already a dependency of windows)
windows-numerics = "0.3" # Vector2 for composition visuals (already a dependency of windows)
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Image encoding in unoptimized dependencies is ~20x slower; keep dev builds representative.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
