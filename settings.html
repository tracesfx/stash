<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stash settings</title>
    <style>
      body { overflow: hidden; user-select: none; }
      #app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; opacity: 0; transform: translateY(6px) scale(.99); transition: opacity 220ms var(--ease), transform 260ms var(--ease); }
      #app.in { opacity: 1; transform: none; }
      #app.out { opacity: 0; transform: scale(.985); transition-duration: 140ms; }
      /* entrance (window_ready shows the hidden window, then body.opening plays once) */
      body.pre #app { opacity: 0; }
      body.opening h1 { animation: s-drop 440ms var(--ease) both; }
      body.opening #tabs { animation: s-pop 520ms var(--spring) 70ms both; }
      body.opening .pane.on > * { animation: s-rise 480ms var(--ease) both; animation-delay: calc(120ms + var(--i, 0) * 45ms); }
      body.opening footer { animation: s-foot 440ms var(--ease) 180ms both; }
      @keyframes s-drop { from { opacity: 0; transform: translateY(-12px); } }
      @keyframes s-pop { from { opacity: 0; transform: scale(.92); } }
      @keyframes s-rise { from { opacity: 0; transform: translateY(16px) scale(.985); } }
      @keyframes s-foot { from { opacity: 0; transform: translateY(10px); } }
      /* live preview of the native glass */
      .pv { padding: 14px 0; }
      .pv img { display: block; width: 100%; aspect-ratio: 560 / 210; border-radius: var(--r-l); background: rgba(0, 0, 0, .25); box-shadow: inset 0 0 0 1px var(--line); object-fit: cover; }

      header { padding: 22px 28px 14px; display: flex; flex-direction: column; gap: 16px; }
      h1 { margin: 0; font: 600 2rem/1.1 var(--font-display); letter-spacing: -.01em; }
      #tabs { align-self: flex-start; max-width: 100%; overflow-x: auto; scrollbar-width: none; }

      main { position: relative; overflow-y: auto; overflow-x: hidden; padding: 4px 28px 24px; scrollbar-gutter: stable; }
      .pane { display: none; flex-direction: column; gap: 18px; }
      .pane.on { display: flex; animation: pane-in 220ms var(--ease) both; }
      @keyframes pane-in { from { opacity: 0; transform: translateY(8px); } }

      .gt { margin: 4px 4px -8px; font-size: 0.846rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
      .group { border-radius: var(--r-xl); background: var(--glass-card), var(--surface); box-shadow: var(--rim), 0 8px 30px rgba(0, 0, 0, .12); padding: 2px 18px; }
      .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 20px; padding: 14px 0; border-top: 1px solid var(--line); }
      .row:first-child { border-top: 0; }
      .row.stack { grid-template-columns: minmax(0, 1fr) auto; row-gap: 10px; }
      .row.stack > .ctl { grid-column: 1 / -1; }
      .lab { font-weight: 600; }
      .hint { color: var(--faint); font-size: 0.923rem; margin-top: 3px; line-height: 1.45; text-wrap: pretty; }
      .val { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 0.923rem; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); box-shadow: var(--rim); white-space: nowrap; min-width: 5rem; text-align: center; }
      .ctl.inline { display: flex; align-items: center; gap: 8px; }
      .row.dis .lab, .row.dis .hint { opacity: .45; }

      /* shortcut */
      .keys { display: flex; gap: 6px; align-items: center; min-height: 30px; }
      .keys .rect { color: var(--dim); animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .45; } }

      /* corner picker (note & toast position) */
      .corners { display: grid; grid-template-columns: repeat(2, 30px); grid-template-rows: repeat(2, 22px); gap: 4px; padding: 5px; border-radius: 10px; background: rgba(0, 0, 0, .22); box-shadow: inset 0 0 0 1px var(--line); }
      .corners button { border: 0; border-radius: 6px; background: rgba(255, 255, 255, .07); cursor: pointer; transition: background var(--dur) var(--ease), transform var(--dur) var(--spring); }
      .corners button:hover { background: rgba(255, 255, 255, .16); }
      .corners button.on { background: rgba(255, 255, 255, .9); transform: scale(1.04); }

      /* wheel tiles */
      .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr)); gap: 10px; padding: 16px 0; }
      .tile { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 13px 14px; border: 0; border-radius: var(--r-l); text-align: left; cursor: pointer; background: rgba(0, 0, 0, .16); box-shadow: inset 0 0 0 1px var(--line); color: var(--dim); transition: background 180ms var(--ease), box-shadow 180ms var(--ease), transform 220ms var(--spring), color 180ms; }
      .tile:hover { background: rgba(255, 255, 255, .07); color: var(--txt); }
      .tile:active { transform: scale(.97); }
      .tile.on { background: linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .07)); box-shadow: var(--rim), 0 6px 18px rgba(0, 0, 0, .2); color: var(--txt); }
      .tile svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .tile b { font-weight: 600; font-size: 1rem; color: var(--txt); }
      .tile span { font-size: 0.885rem; line-height: 1.35; color: var(--faint); }
      .tile .ck { position: absolute; top: 10px; right: 10px; width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .3); transition: all 200ms var(--spring); }
      .tile.on .ck { background: #fff; box-shadow: none; }
      .tile.on .ck::after { content: ""; position: absolute; left: 6px; top: 3px; width: 4px; height: 8px; border: solid #111; border-width: 0 2px 2px 0; transform: rotate(45deg); }
      .tile.shake { animation: shake 320ms ease; }
      @keyframes shake { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }

      /* menu animation picker: a mini wheel per animation (plays on hover / pick) */
      .atiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.6rem, 1fr)); gap: 10px; }
      .atile { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 10px 12px; border: 0; border-radius: var(--r-l); cursor: pointer; background: rgba(0, 0, 0, .16); box-shadow: inset 0 0 0 1px var(--line); color: var(--dim); transition: background 180ms var(--ease), box-shadow 180ms var(--ease), transform 220ms var(--spring); }
      .atile:hover { background: rgba(255, 255, 255, .07); color: var(--txt); }
      .atile:active { transform: scale(.97); }
      .atile.on { background: linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .07)); box-shadow: var(--rim), 0 0 0 2px color-mix(in srgb, var(--hover) 80%, transparent), 0 6px 18px rgba(0, 0, 0, .2); color: var(--txt); }
      .atile svg { width: 68px; height: 68px; margin-bottom: 6px; overflow: visible; }
      .atile svg path { fill: rgba(255, 255, 255, .13); stroke: rgba(255, 255, 255, .34); stroke-width: .8; }
      .atile svg path.hot { fill: color-mix(in srgb, var(--hover) 62%, transparent); }
      .atile svg circle { fill: rgba(255, 255, 255, .85); }
      .atile svg circle.hub { fill: rgba(255, 255, 255, .1); stroke: rgba(255, 255, 255, .3); stroke-width: .8; }
      .atile b { font-weight: 600; font-size: 1rem; color: var(--txt); }
      .atile span { font-size: 0.846rem; line-height: 1.3; color: var(--faint); text-align: center; }
      .atiles.off { opacity: .45; pointer-events: none; }

      /* small segmented choice (window size) */
      .seg.mini { flex-wrap: wrap; justify-self: start; }
      .seg.mini button { padding: 6px 14px; transition: color var(--dur) var(--ease), background var(--dur) var(--ease); }
      .seg.mini button.on { background: linear-gradient(180deg, rgba(255, 255, 255, .2), rgba(255, 255, 255, .1)); box-shadow: var(--rim); }
      .hint.warn { color: #ffcf7a; }
      /* themes */
      .themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); gap: 10px; }
      .theme { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 0; border-radius: var(--r-l); text-align: left; cursor: pointer; color: var(--dim); background: rgba(0, 0, 0, .16); box-shadow: inset 0 0 0 1px var(--line); transition: background 180ms var(--ease), box-shadow 180ms var(--ease), transform 220ms var(--spring); }
      .theme:hover { background: rgba(255, 255, 255, .07); color: var(--txt); }
      .theme:active { transform: scale(.97); }
      .theme.on { color: var(--txt); background: linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .07)); box-shadow: var(--rim), 0 0 0 2px color-mix(in srgb, var(--hover) 80%, transparent); }
      .theme .tsw { flex: none; width: 26px; height: 26px; border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .3), 0 3px 8px rgba(0, 0, 0, .3); }
      .theme b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
      .theme .tx { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; display: none; font-size: 0.846rem; line-height: 20px; text-align: center; color: #fff; background: rgba(30, 31, 38, .95); box-shadow: var(--rim); }
      .theme:hover .tx, .theme .tx.arm { display: block; }
      .theme .tx:hover, .theme .tx.arm { background: var(--danger); color: #111; }
      /* library folder */
      .folder { display: flex; gap: 8px; }
      .folder .field { flex: 1; min-width: 0; font-size: 0.962rem; }

      /* appearance */
      .swatches { display: flex; align-items: center; gap: 10px; }
      .sw { position: relative; width: 34px; height: 34px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px rgba(255, 255, 255, .25), 0 4px 12px rgba(0, 0, 0, .3); cursor: pointer; transition: transform 200ms var(--spring); }
      .sw:hover { transform: scale(1.08); }
      .sw input { position: absolute; inset: -8px; width: 60px; height: 60px; border: 0; padding: 0; cursor: pointer; background: none; }
      .gprev { flex: 1; min-width: 60px; height: 34px; border-radius: 999px; box-shadow: var(--rim); }

      /* statistics (src/stats-view.ts): single-hue charts in the accent; text stays in the text colours */
      .stats { display: flex; flex-direction: column; gap: 14px; user-select: text; }
      .shead { display: flex; align-items: center; gap: 14px; justify-content: space-between; }
      .stiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: 10px; }
      .stile { padding: 14px 16px; border-radius: var(--r-l); background: var(--glass-card), var(--surface); box-shadow: var(--rim); }
      .stile .sv { font: 600 1.6rem/1.1 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .stile .sl { margin-top: 4px; font-weight: 600; color: var(--dim); }
      .stile .ss { margin-top: 2px; font-size: 0.846rem; color: var(--faint); }
      .scard { padding: 14px 18px 16px; border-radius: var(--r-xl); background: var(--glass-card), var(--surface); box-shadow: var(--rim); min-width: 0; }
      .scard h3 { margin: 0 0 12px; font: 600 1rem var(--font-display); }
      .scard > .hint { margin-top: 10px; }
      .stwo { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 14px; }
      .hbars { display: flex; flex-direction: column; gap: 7px; }
      .hb { display: grid; grid-template-columns: minmax(4.5rem, 38%) 1fr auto; align-items: center; gap: 10px; font-size: 0.923rem; }
      .hb .hl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
      .hb .tr { height: 10px; }
      .hb .tr i { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--accent); }
      .hb .hv { min-width: 2.5rem; text-align: right; font-variant-numeric: tabular-nums; color: var(--txt); }
      .hb:hover .hl { color: var(--txt); }
      .hb:hover .tr i { filter: brightness(1.2); }
      .vbars { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; height: 120px; }
      .vb { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      .vb .col { flex: 1; display: flex; align-items: flex-end; border-bottom: 1px solid var(--line); }
      .vb .col i { display: block; width: 100%; border-radius: 4px 4px 0 0; background: var(--accent); }
      .vb .col i.z { height: 0 !important; }
      .vb:hover .col i { filter: brightness(1.2); }
      .vb span { height: 1.1em; font-size: 0.769rem; color: var(--faint); white-space: nowrap; overflow: visible; }
      .cal { overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; }
      .calm, .calg { display: grid; grid-template-columns: repeat(53, minmax(0, 1fr)); gap: 3px; min-width: 36rem; }
      .calm span { font-size: 0.769rem; color: var(--faint); white-space: nowrap; overflow: visible; height: 1.3em; }
      .calw { display: grid; grid-template-rows: repeat(7, 1fr); gap: 3px; }
      .calw i, .call i { display: block; aspect-ratio: 1; border-radius: 3px; background: rgba(255, 255, 255, .06); }
      .calw i.fut { background: none; }
      .calw i:hover:not(.fut) { box-shadow: 0 0 0 1.5px var(--txt); }
      .l1 { background: color-mix(in srgb, var(--accent) 30%, rgba(255, 255, 255, .06)) !important; }
      .l2 { background: color-mix(in srgb, var(--accent) 55%, rgba(255, 255, 255, .06)) !important; }
      .l3 { background: color-mix(in srgb, var(--accent) 78%, rgba(255, 255, 255, .06)) !important; }
      .l4 { background: var(--accent) !important; }
      .call { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 8px; font-size: 0.769rem; color: var(--faint); }
      .call i { width: 11px; }
      .call span { margin: 0 4px; }
      .facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; font-size: 0.923rem; color: var(--faint); }
      .facts b { color: var(--txt); font-weight: 500; font-variant-numeric: tabular-nums; }
      footer { display: flex; align-items: center; gap: 10px; padding: 14px 28px 18px; border-top: 1px solid var(--line); background: rgba(0, 0, 0, .12); }
      footer .grow { flex: 1; min-width: 0; }
      /* changes save themselves: a quiet "Saved" tick confirms each one */
      #status { display: inline-flex; align-items: center; gap: 6px; max-width: 70%; font-size: 0.923rem; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transform: translateY(3px); transition: opacity 200ms var(--ease), transform 200ms var(--ease); }
      #status.on { opacity: 1; transform: none; }
      #status.ok::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
      #status.err { color: var(--danger); white-space: normal; }
      #appBtn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      #appBtn.on { color: var(--txt); background: var(--surface); }
      /* Advanced off: only the basic rows (and groups that still have some) are shown */
      body.basic .adv { display: none !important; }
      body.basic .group:not(:has(> :not(.adv))) { display: none; }
      body.basic .gt:has(+ .group:not(:has(> :not(.adv)))) { display: none; }
    </style>
  </head>
  <body class="glass pre">
    <div id="app">
      <header>
        <h1>Settings</h1>
        <nav class="seg" id="tabs" role="tablist"></nav>
      </header>
      <main id="panes"></main>
      <footer>
        <button class="btn ghost" id="appBtn" title="Show all settings, including Appearance">
          <svg viewBox="0 0 16 16"><path d="M2.5 4.5h7M12.5 4.5h1M2.5 11.5h1M6.5 11.5h7"/><circle cx="11" cy="4.5" r="1.5"/><circle cx="5" cy="11.5" r="1.5"/></svg>Advanced
        </button>
        <span class="grow"></span>
        <span id="status"></span>
      </footer>
    </div>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
