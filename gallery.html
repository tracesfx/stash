<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stash</title>
    <style>
      #app { position: relative; overflow: hidden; display: grid; grid-template-columns: 16.6rem 1fr; grid-template-rows: auto 1fr; height: 100%; }
      /* top bar */
      header { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; padding: 10px 16px; min-width: 0; }
      .brand { display: flex; align-items: center; gap: 8px; width: 15.4rem; flex: none; font: 600 1.154rem var(--font-display); letter-spacing: .01em; }
      .brand img { width: 26px; height: 26px; margin: -2px 0; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .35)); }
      .search { position: relative; flex: 1; min-width: 140px; max-width: 460px; }
      .search svg { position: absolute; left: 12px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); stroke: var(--faint); fill: none; stroke-width: 1.6; stroke-linecap: round; pointer-events: none; }
      #q { padding-left: 34px; border-radius: 999px; height: 36px; }
      #qsugg { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 40; display: none; padding: 4px; border-radius: var(--r-l); background: rgba(30, 31, 38, .97); box-shadow: var(--rim), var(--shadow); }
      #qsugg.on { display: block; }
      #qsugg button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border: 0; border-radius: var(--r-s); background: none; color: var(--dim); text-align: left; cursor: pointer; }
      #qsugg button.hi, #qsugg button:hover { background: color-mix(in srgb, var(--hover) 30%, transparent); color: var(--txt); }
      #qsugg button b { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #qsugg button span { color: var(--faint); font-size: 0.846rem; }
      #qsugg button i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .3); }
      #count { margin-left: auto; color: var(--faint); font-size: 0.923rem; white-space: nowrap; }
      header .seg button { padding: 6px 14px; }
      .ibtn { padding: 8px 11px; }
      /* rail */
      #rail { grid-column: 1; grid-row: 2; overflow-y: auto; padding: 4px 8px 16px 12px; }
      .rh { margin: 14px 8px 6px; font-size: 0.846rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
      .ri { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 6px 10px; border: 0; border-radius: var(--r-s); background: transparent; color: var(--dim); text-align: left; cursor: pointer; transition: background var(--dur) var(--ease), color var(--dur); }
      .ri:hover { background: color-mix(in srgb, var(--hover) 20%, var(--surface)); color: var(--txt); }
      .ri.on { background: var(--surface-2); color: var(--txt); box-shadow: inset 2px 0 0 var(--accent); }
      .ri span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ri .n { color: var(--faint); font-size: 0.846rem; font-variant-numeric: tabular-nums; }
      /* tag collections: cover tiles */
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 2px 2px 4px; }
      .col { position: relative; height: 74px; border: 0; padding: 0; border-radius: var(--r-m); overflow: hidden; cursor: pointer; text-align: left; color: #fff; background: var(--surface-2) center / cover no-repeat; box-shadow: var(--rim); transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
      .col::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 25%, rgba(0, 0, 0, .72)); }
      .col.txt { background-image: var(--glass-card); }
      .col.txt .sn { position: absolute; inset: 8px 9px auto; font-size: 0.769rem; line-height: 1.3; color: var(--dim); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .col b, .col i { position: absolute; z-index: 1; left: 9px; font-style: normal; }
      .col b { bottom: 18px; right: 9px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .col i { bottom: 5px; font-size: 0.769rem; color: rgba(255, 255, 255, .7); }
      .col:hover { transform: translateY(-1px); box-shadow: var(--rim), 0 0 0 2px color-mix(in srgb, var(--hover) 55%, transparent); }
      .col.on { box-shadow: 0 0 0 2px var(--accent); }
      .more { margin: 2px 0 0; }
      /* main */
      #main { grid-column: 2; grid-row: 2; position: relative; display: flex; flex-direction: column; backdrop-filter: var(--blur); min-width: 0; min-height: 0; background: var(--surface); border-top-left-radius: var(--r-l); border: 1px solid var(--line); border-right: 0; border-bottom: 0; overflow: hidden; }
      #chips { display: none; flex-wrap: wrap; gap: 6px; padding: 10px 16px 0; }
      #chips.on { display: flex; }
      #chips .chip { padding: 4px 6px 4px 12px; color: var(--txt); background: var(--surface-2); }
      #chips .chip b { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font-weight: 400; color: var(--dim); }
      #chips .chip:hover b { background: rgba(255, 255, 255, .16); color: var(--txt); }
      #grid-wrap { position: relative; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-gutter: stable; padding: 0 30px 40px 16px; }
      #grid-wrap, #rail, #detail .in, #cvhome { overscroll-behavior: contain; }
      #grid { position: relative; }
      /* one continuous masonry (gallery.ts positions every tile): a day label sits on top of its first item, so
         short days share rows and short items stack */
      #grid { margin-top: 14px; }
      .dl { position: absolute; left: 0; top: 0; display: flex; align-items: flex-end; height: 30px; padding: 0 2px 4px; will-change: transform; }
      .dl.leaving { pointer-events: none; }
      .dl button { display: inline-flex; align-items: baseline; gap: 8px; padding: 4px 12px; border: 0; border-radius: 999px; background: rgba(22, 23, 30, .5); box-shadow: var(--rim); color: var(--txt); font: 600 0.923rem var(--font-display); cursor: pointer; white-space: nowrap; }
      .dl button span { color: var(--faint); font: 400 0.846rem var(--font); }
      .dl button:hover { background: rgba(40, 42, 54, .8); }
      /* the day you are scrolled to, floating over the grid */
      #daypill { position: absolute; left: 50%; top: 10px; z-index: 9; transform: translate(-50%, -8px); padding: 5px 14px; border-radius: 999px; background: rgba(22, 23, 30, .72); backdrop-filter: blur(14px) saturate(1.4); box-shadow: var(--rim), 0 6px 20px rgba(0, 0, 0, .3); font: 600 0.923rem var(--font-display); opacity: 0; pointer-events: none; transition: opacity 180ms var(--ease), transform 180ms var(--ease); }
      #daypill.on { opacity: 1; transform: translate(-50%, 0); }
      /* trash tab bar */
      #tbar { display: none; align-items: center; gap: 12px; padding: 12px 16px 0; color: var(--dim); }
      #tbar.on { display: flex; }
      #tbar .grow { flex: 1; }
      .card .ago { padding: 6px 12px 8px; font-size: 0.846rem; color: var(--faint); border-top: 1px solid var(--line); }
      /* the Create canvas button: bright pill with a slowly turning fluorescent glow */
      @property --spin { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
      .btn.glow { position: relative; isolation: isolate; background: transparent !important; color: #15131d; font-weight: 700; box-shadow: none; }
      .btn.glow::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: linear-gradient(180deg, #fff, #f1ecff); box-shadow: inset 0 -1px 0 rgba(90, 60, 160, .18); }
      .btn.glow::before { content: ""; position: absolute; inset: -3px; z-index: -2; border-radius: inherit; background: conic-gradient(from var(--spin), #8b5cff, #ff4fd8, #47c8ff, #7dffcf, #8b5cff); filter: blur(10px); opacity: .66; animation: glow-spin 3.6s linear infinite; }
      .btn.glow::before { transition: opacity 360ms var(--ease); }
      .btn.glow:hover::before { opacity: .8; }
      .btn.glow svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      @keyframes glow-spin { to { --spin: 360deg; } }
      /* canvases tab: list of saved canvases */
      #cvhome { display: none; flex: 1; min-height: 0; overflow-y: auto; padding: 16px; }
      #cvhome.on { display: block; }
      #cvhome .cvs { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
      .cvc { position: relative; border-radius: var(--r-l); overflow: hidden; background: var(--surface-solid); border: 1px solid var(--line); box-shadow: var(--rim); cursor: pointer; transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
      .cvc:hover { transform: translateY(-2px); box-shadow: var(--shadow), 0 0 0 2px color-mix(in srgb, var(--hover) 55%, transparent); }
      .cvc .col4 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; height: 150px; background: rgba(0, 0, 0, .3); }
      .cvc .col4 > * { background: var(--surface) center / cover no-repeat; overflow: hidden; padding: 6px 8px; font-size: 0.769rem; color: var(--dim); line-height: 1.3; }
      .cvc .nm { padding: 10px 12px 2px; font: 600 1rem var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cvc .mt { padding: 0 12px 11px; font-size: 0.846rem; color: var(--faint); }
      .cvc .del { position: absolute; top: 8px; right: 8px; opacity: 0; }
      .cvc:hover .del { opacity: 1; }
      .cvempty { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12vh 20px; color: var(--dim); text-align: center; }
      .cvempty h2 { margin: 0; font: 600 1.231rem var(--font-display); color: var(--txt); }
      /* canvas editor header */
      #cv-head { position: absolute; left: 12px; right: 12px; top: 12px; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 999px; background: var(--surface-solid); box-shadow: var(--rim), var(--shadow); }
      #cv-head .btn { padding: 6px 12px; }
      #cv-head input { flex: 0 1 280px; min-width: 120px; height: 32px; border: 0; border-radius: 999px; padding: 0 12px; background: rgba(0, 0, 0, .2); font: 600 1rem var(--font-display); outline: none; }
      #cv-head input:focus { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--hover) 70%, white); }
      #cv-head .st { display: inline-flex; align-items: center; gap: 6px; color: var(--faint); font-size: 0.885rem; white-space: nowrap; }
      #cv-head .st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
      #cv-head .st.busy::before { background: #f5c451; box-shadow: 0 0 8px #f5c451; }
      #cv-head .st.err { color: var(--danger); }
      #cv-head .st.err::before { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
      #cv-head .grow { flex: 1; }
      .card { position: absolute; left: 0; top: 0; border-radius: var(--r-m); overflow: hidden; cursor: pointer; background: var(--surface-solid); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(0,0,0,.18), var(--rim); transition: box-shadow var(--dur) var(--ease), border-color var(--dur); will-change: transform; }
      .card.leaving { pointer-events: none; z-index: 0; }
      .card:hover { box-shadow: var(--shadow), 0 0 0 2px color-mix(in srgb, var(--hover) 55%, transparent); z-index: 2; }
      .card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), var(--shadow); z-index: 2; }
      .card img { position: relative; z-index: 1; display: block; width: 100%; height: auto; opacity: 0; transition: opacity 240ms var(--ease); background: var(--surface); }
      .card img.ok { opacity: 1; }
      /* loading sweep: a transform-only animation (runs on the compositor), only on cards whose picture is loading */
      .card.ld::before { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(100deg, transparent 30%, var(--surface-2) 50%, transparent 70%); transform: translateX(-100%); animation: shimmer 1.2s linear infinite; }
      @keyframes shimmer { to { transform: translateX(100%); } }
      .card .vplay { position: absolute; left: 0; top: 0; z-index: 2; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 160ms var(--ease); pointer-events: none; background: transparent !important; }
      .card .vplay.on { opacity: 1; }
      .card .t { padding: 12px; max-height: 160px; overflow: hidden; word-break: break-word; white-space: pre-wrap; }
      .card .t.link { color: var(--accent); font-size: 0.923rem; }
      .card .f { padding: 16px 12px; display: flex; gap: 8px; align-items: center; }
      .badge { padding: 2px 7px; border-radius: 5px; background: var(--surface-2); color: var(--dim); font-size: 0.846rem; text-transform: uppercase; }
      .card .cap { padding: 7px 12px 9px; font-size: 0.923rem; color: var(--dim); border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .card .src { display: flex; align-items: center; gap: 6px; padding: 0 12px 10px; font-size: 0.846rem; color: var(--faint); min-width: 0; }
      .card .src span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      /* Notes tab: a readable list */
      .card.note { background: color-mix(in srgb, var(--surface-solid) 70%, transparent); }
      .card.note .nt { padding: 14px 16px 8px; font-size: 1.077rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word; max-height: 12.5em; overflow: hidden; }
      .card.note .nt.link { color: var(--accent); font-size: 0.962rem; }
      .card.note .src { padding: 2px 16px 12px; font-size: 0.885rem; }
      .card.note .src a { color: var(--dim); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .card.note .src a:hover { color: var(--accent); text-decoration: underline; }
      .card.note .tg { color: var(--accent); white-space: nowrap; }
      .card.note .tm { margin-left: auto; flex: none; }
      .acts { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; opacity: 0; transform: translateY(-3px); transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease); z-index: 3; }
      .card:hover .acts { opacity: 1; transform: none; }
      /* the buttons blur what is under them only while they can be seen: a backdrop-filter costs a layer and a
         render pass per button even at opacity 0, which made every scroll frame re-layerize ~5 layers per card */
      .card .ab { backdrop-filter: none; }
      .card:hover .ab { backdrop-filter: blur(10px); }
      .ab { display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 8px; color: #fff; background: rgba(20,20,26,.72); backdrop-filter: blur(10px); cursor: pointer; }
      .ab:hover { background: rgba(20,20,26,.92); }
      .ab.d:hover { background: #c4283d; }
      .ab svg, .ico { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      /* timeline scrubber */
      #scrub { position: absolute; right: 2px; top: 8px; bottom: 8px; width: 22px; z-index: 8; cursor: ns-resize; opacity: .55; transition: opacity var(--dur); }
      #scrub:hover, #scrub.drag { opacity: 1; }
      #scrub.off { display: none; }
      #scrub .tk { position: absolute; right: 7px; width: 6px; height: 2px; border-radius: 1px; background: rgba(255, 255, 255, .35); }
      #scrub .tk.m { width: 10px; background: rgba(255, 255, 255, .7); }
      #scrub .ml { position: absolute; right: 20px; transform: translateY(-50%); font-size: 0.769rem; color: var(--faint); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity var(--dur); }
      #scrub:hover .ml, #scrub.drag .ml { opacity: 1; }
      #scrub .bub { position: absolute; right: 24px; transform: translateY(-50%); padding: 4px 10px; border-radius: 999px; background: var(--surface-solid); box-shadow: var(--rim), var(--shadow); font-weight: 600; white-space: nowrap; pointer-events: none; display: none; }
      #scrub:hover .bub, #scrub.drag .bub { display: block; }
      #scrub .pos { position: absolute; right: 4px; width: 12px; height: 4px; border-radius: 2px; background: var(--accent); }
      /* empty */
      #empty { display: none; flex-direction: column; align-items: center; gap: 10px; padding: 12vh 20px; color: var(--dim); text-align: center; }
      #empty.on { display: flex; }
      #empty svg { width: 64px; height: 64px; opacity: .85; }
      #empty h2 { margin: 6px 0 0; font: 600 1.231rem var(--font-display); color: var(--txt); }
      /* canvas view */
      #canvas { position: relative; flex: 1; min-height: 0; overflow: hidden; display: none; cursor: grab; touch-action: none; }
      #canvas.on { display: block; }
      #canvas.pan { cursor: grabbing; }
      #cv-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
      .cv-item { position: absolute; left: 0; top: 0; border-radius: var(--r-m); overflow: hidden; background: var(--surface-solid); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0, 0, 0, .28), var(--rim); cursor: default; user-select: none; }
      .cv-item img, .cv-item video { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
      .cv-item.sel { box-shadow: 0 0 0 2px var(--accent), 0 10px 30px rgba(0, 0, 0, .35); z-index: 2; }
      .cv-item.drag { z-index: 3; box-shadow: 0 0 0 2px var(--accent), 0 18px 44px rgba(0, 0, 0, .45); }
      .cv-note { padding: 12px 14px; background: var(--glass-card), rgba(36, 37, 46, .9); }
      .cv-note .nt { white-space: pre-wrap; word-break: break-word; line-height: 1.5; max-height: 18em; overflow: hidden; }
      .cv-note .src { margin-top: 8px; font-size: 0.846rem; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cv-file { padding: 14px; display: flex; gap: 8px; align-items: center; }
      #cv-bar { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 999px; background: var(--surface-solid); box-shadow: var(--rim), var(--shadow); z-index: 5; }
      #cv-bar .btn { padding: 6px 12px; }
      #cv-bar .z { min-width: 48px; text-align: center; color: var(--dim); font-variant-numeric: tabular-nums; }
      #cv-note { position: absolute; left: 14px; bottom: 14px; padding: 6px 12px; border-radius: 999px; background: var(--surface-solid); color: var(--dim); font-size: 0.923rem; z-index: 5; display: none; }
      #cv-note.on { display: block; }
      /* detail */
      #detail { grid-column: 2; grid-row: 2; justify-self: end; z-index: 12; width: 320px; margin: 10px 10px 10px 0; min-height: 0; overflow: hidden; border-radius: var(--r-l); border: 1px solid rgba(255, 255, 255, .08); background: rgba(18, 19, 26, .34); backdrop-filter: blur(3px); box-shadow: var(--rim); text-shadow: 0 1px 3px rgba(0, 0, 0, .7);
        opacity: 0; visibility: hidden; pointer-events: none; transform: translateX(calc(100% + 18px)) scale(.985);
        transition: transform 300ms cubic-bezier(.4, 0, .2, 1), opacity 200ms var(--ease), visibility 0s linear 300ms; }
      body.detail #detail { opacity: 1; visibility: visible; transform: none; transition: transform 460ms cubic-bezier(.16, 1.08, .3, 1), opacity 520ms cubic-bezier(.45, 0, .25, 1), visibility 0s; }
      body.detail #detail.peek { opacity: .3; }
      /* only the fields take the pointer; clicks anywhere else land on the cards underneath */
      body.detail #detail input, body.detail #detail .tagin, body.detail #detail .sugg, body.detail #detail a, body.detail #detail .dot, body.detail #detail details, body.detail #detail .tx { pointer-events: auto; }
      #detail .pv { opacity: .85; pointer-events: auto; cursor: zoom-in; }
      #detail .meta { margin-top: 16px; }
      #detail .in { width: 100%; height: 100%; overflow-y: auto; padding: 16px; }
      #scrub { transition: opacity var(--dur), right 360ms cubic-bezier(.16, 1, .3, 1); }
      body.detail #scrub { right: 334px; }
      #detail .pv { width: 100%; max-height: 300px; object-fit: contain; background: var(--bg); border-radius: var(--r-m); display: block; margin-bottom: 12px; cursor: zoom-in; }
      #detail .tx { padding: 12px; background: var(--surface); border-radius: var(--r-m); max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-word; margin-bottom: 12px; }
      label.l { display: block; margin: 12px 0 5px; color: var(--faint); font-size: 0.846rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
      .meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 0.923rem; color: var(--faint); }
      .meta b { color: var(--txt); font-weight: 400; word-break: break-all; }
      .meta a { color: var(--accent); cursor: pointer; }
      /* tag chip input with autocomplete */
      .tagin { position: relative; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; padding: 6px 8px; border-radius: var(--r-m); background: rgba(0, 0, 0, .18); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .25), inset 0 0 0 1px var(--line); cursor: text; }
      .tagin:focus-within { box-shadow: inset 0 1px 2px rgba(0, 0, 0, .25), inset 0 0 0 1px color-mix(in srgb, var(--hover) 70%, white); }
      .tagin .tc { display: inline-flex; align-items: center; gap: 2px; padding: 2px 4px 2px 9px; border-radius: 999px; background: color-mix(in srgb, var(--hover) 30%, var(--surface-2)); font-size: 0.923rem; }
      .tagin .tc button { display: grid; place-items: center; width: 16px; height: 16px; border: 0; padding: 0; border-radius: 50%; background: none; color: var(--dim); cursor: pointer; }
      .tagin .tc button:hover { background: rgba(255, 255, 255, .18); color: var(--txt); }
      .tagin input { flex: 1; min-width: 70px; border: 0; background: none; outline: none; padding: 3px 2px; }
      .sugg { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 40; display: none; padding: 4px; border-radius: var(--r-m); background: rgba(30, 31, 38, .97); box-shadow: var(--rim), var(--shadow); }
      .sugg.on { display: block; }
      .sugg button { display: flex; justify-content: space-between; width: 100%; padding: 6px 10px; border: 0; border-radius: var(--r-s); background: none; color: var(--dim); text-align: left; cursor: pointer; }
      .sugg button.hi, .sugg button:hover { background: color-mix(in srgb, var(--hover) 30%, transparent); color: var(--txt); }
      .sugg button span { color: var(--faint); font-size: 0.846rem; }
      /* viewer */
      #viewer { position: fixed; inset: 0; display: none; place-items: center; background: rgba(8,8,12,.9); backdrop-filter: blur(14px); z-index: 20; }

      .card .fb { position: absolute; top: 8px; left: 8px; z-index: 4; display: grid; place-items: center; width: 26px; height: 26px; border: 0; border-radius: 50%; padding: 0; color: #fff; background: rgba(20, 20, 26, .62); backdrop-filter: blur(8px); cursor: pointer; opacity: 0; transform: scale(.8); transition: opacity var(--dur) var(--ease), transform 220ms var(--spring), background var(--dur); }

      .card.fav::after { content: ""; position: absolute; inset: 0; z-index: 2; border-radius: inherit; pointer-events: none; mix-blend-mode: screen; opacity: .13;
        background: linear-gradient(115deg, transparent 18%, #ff7ac8 30%, #ffe37a 38%, #7affc8 46%, #78b8ff 54%, #c48aff 62%, transparent 76%) var(--hx, 25%) var(--hy, 25%) / 260% 260%;
        transition: opacity 320ms var(--ease), background-position 700ms var(--ease); }

      .card.fav.sel { border-color: #fff; animation: glow-spin 3.6s linear infinite;

      /* View menu */

      #selbar { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 16px); display: flex; gap: 8px; align-items: center; padding: 8px 10px 8px 16px; border-radius: 999px; background: var(--surface-solid); border: 1px solid var(--line); box-shadow: var(--shadow); backdrop-filter: var(--blur); opacity: 0; pointer-events: none; transition: opacity 160ms var(--ease), transform 160ms var(--ease); z-index: 15; }

      /* canvas: add items from the library */
      #cvadd { position: absolute; left: 50%; top: 64px; bottom: 70px; z-index: 6; width: min(760px, calc(100% - 40px)); display: none; flex-direction: column; border-radius: var(--r-l); background: rgba(28, 29, 36, .97); box-shadow: var(--rim), var(--shadow); transform: translateX(-50%); overflow: hidden; cursor: default; }

      #cvadd .at { position: relative; border: 0; padding: 0; border-radius: var(--r-m); overflow: hidden; cursor: pointer; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--dim); text-align: left; transition: transform 160ms var(--spring), box-shadow 160ms var(--ease); }

      #tagpop { position: fixed; bottom: 76px; left: 50%; width: 340px; transform: translate(-50%, 10px); padding: 12px; border-radius: var(--r-l); background: var(--surface-solid); border: 1px solid var(--line); box-shadow: var(--shadow); z-index: 16; opacity: 0; pointer-events: none; transition: opacity 160ms var(--ease), transform 160ms var(--ease); }

      .card:hover .vbadge { opacity: 0; }
      .card .t.code { font: 0.885rem/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; overflow: hidden; max-height: 180px; position: relative; }

      #viewer .vn { position: absolute; top: 50%; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(40,40,50,.8); color: #fff; font-size: 1.538rem; cursor: pointer; }

      .dot { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; padding: 0; transition: transform var(--dur) var(--ease); }
