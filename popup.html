<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stash capture</title>
    <style>
      html, body { background: transparent !important; overflow: hidden; user-select: none; }
      #wrap { height: 100%; padding: 12px; }
      #card {
        position: relative; height: 100%; padding: 10px 10px 16px; display: flex; flex-direction: column; gap: 8px; cursor: pointer;
        background: var(--surface-solid); border: 1px solid var(--line); border-radius: var(--r-l); box-shadow: var(--shadow);
        backdrop-filter: var(--blur); animation: in 220ms var(--ease) both;
      }
      :root[data-theme="glass"] #card { background: var(--glass-card); }
      #card.out { animation: out 150ms var(--ease) forwards; }
      @keyframes in { from { opacity: 0; transform: translateX(28px) scale(.96); } to { opacity: 1; transform: none; } }
      @keyframes out { to { opacity: 0; transform: translateX(20px) scale(.97); } }
      #thumb { flex: none; height: 134px; display: flex; align-items: center; justify-content: center; background: var(--surface); border-radius: var(--r-m); overflow: hidden; position: relative; }
      #thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
      #txt { display: none; padding: 12px; width: 100%; max-height: 100%; overflow: hidden; line-height: 1.4; white-space: pre-wrap; word-break: break-word; align-self: flex-start; }
      #hint { position: absolute; bottom: 6px; right: 6px; font-size: 11px; color: #fff; background: rgba(15,15,20,.65); backdrop-filter: blur(8px); padding: 2px 8px; border-radius: 999px; opacity: 0; transition: opacity var(--dur) var(--ease); }
      #card:hover #hint { opacity: 1; }
      #meta { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
      #bar { position: absolute; left: 14px; right: 14px; bottom: 7px; height: 3px; border-radius: 3px; background: var(--accent); transform-origin: left; opacity: .9; }
      #bar.run { animation: drain var(--ms, 1500ms) linear forwards; }
      #card:hover #bar { animation-play-state: paused; }
      @keyframes drain { to { transform: scaleX(0); } }
      body.text #img, body.notice #img { display: none; }
      body.text #txt, body.notice #txt { display: block; }
      body.notice #txt { text-align: center; align-self: center; font-size: 15px; font-weight: 600; }
      body.notice #card { cursor: default; }
      body.notice #thumb { height: 56px; } body.notice #meta, body.notice #hint { display: none; }
      #cap { display: none; width: 100%; user-select: text; }
      body.editing #cap { display: block; }
      body.editing #hint, body.editing #bar { display: none; }
      body.editing #card { cursor: default; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="card">
        <div id="thumb"><img id="img" alt="" /><div id="txt"></div><span id="hint">Click to caption</span></div>
        <div id="meta"></div>
        <input id="cap" class="field" type="text" placeholder="Caption — Enter to save, Esc to close" autocomplete="off" spellcheck="true" />
        <div id="bar"></div>
      </div>
    </div>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
